name: Weekly sports fixtures

on:
  schedule:
    - cron: "7 0 * * 1"     # Mondays 00:07 UTC
  workflow_dispatch:         # manual "Run workflow" button, for testing now

permissions:
  contents: read, write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install .

      - name: Generate report
        env:
          FD_API_KEY: ${{ secrets.FD_API_KEY }}
        run: python sports_fixtures.py --days 7 | tee sports_fixtures.txt

      - name: Publish to run summary
        if: always()
        run: |
          { echo '```text'; cat sports_fixtures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact (kept ~90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports_fixtures
          path: sports_fixtures.txt

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fixtures.txt
          git diff --cached --quiet || (
            git commit -m "Update weekly fixtures"
            git push
          )

      - name: Email report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "This week's sports fixtures"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USER }}
          body: file://sports_fixtures.txt
